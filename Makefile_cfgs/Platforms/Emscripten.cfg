# Web (WebAssembly) build via Emscripten
# Usage: source emsdk_env.sh, then `make PLATFORM=Emscripten`
# Output: bin/Emscripten/ - host the whole folder and open index.html

CC     = emcc
CXX    = em++
STRIP  = :
STATIC = 0

# SDL2/ogg/vorbis come from Emscripten's ports system instead of pkg-config
USE_PKGCONFIG = 0

# theoraplay needs threads, which we don't use on the web (see RETRO_USE_VIDEO_PLAYBACK)
USE_THEORAPLAY = 0

SUFFIX = .js

# RSDK content refers to files with inconsistent casing; the browser FS is case-sensitive
DEFINES += -DFORCE_CASE_INSENSITIVE

# SDL2/ogg/vorbis normally come from Emscripten's ports system. On machines that can't
# download ports, run dependencies/web/build-deps.sh once and build with WEB_DEPS=local.
WEB_DEPS ?= ports

ifeq ($(WEB_DEPS),local)
WEB_PREFIX = dependencies/web/prefix
EMPORTS    =
INCLUDES  += -I$(WEB_PREFIX)/include -I$(WEB_PREFIX)/include/SDL2
LIBS      += $(WEB_PREFIX)/lib/libSDL2.a $(WEB_PREFIX)/lib/libvorbisfile.a $(WEB_PREFIX)/lib/libvorbis.a $(WEB_PREFIX)/lib/libogg.a
else
EMPORTS = -sUSE_SDL=2 -sUSE_OGG=1 -sUSE_VORBIS=1
endif

CFLAGS += $(EMPORTS) -fwasm-exceptions

LDFLAGS += $(EMPORTS) \
	-fwasm-exceptions \
	-sINITIAL_MEMORY=256MB \
	-sALLOW_MEMORY_GROWTH=1 \
	-sSTACK_SIZE=8MB \
	-sENVIRONMENT=web \
	-sFORCE_FILESYSTEM=1 \
	-sEXPORTED_RUNTIME_METHODS=FS,callMain \
	-lidbfs.js

# fcaseopen is plain C; the shared CFLAGS carry -std=c++17 which clang rejects for C files
$(OBJDIR)/RSDKv4/fcaseopen.o: RSDKv4/fcaseopen.c
	@mkdir -p $(@D)
	@echo -n Compiling $<...
	$(CC) -c $(filter-out -std=c++17,$(CFLAGS)) $(INCLUDES) $(DEFINES) $< -o $@
	@echo " Done!"

# Ship the web shell next to the wasm/js output
all: $(OUTDIR)/index.html

$(OUTDIR)/index.html: web/index.html $(OUTDIR)/$(NAME)$(SUFFIX)
	cp web/index.html $@
