# =============================================================================
# Emscripten / WebAssembly
#
# Build with:  ./web/build.sh          (wraps `emmake make PLATFORM=Emscripten`)
#
# Every dependency comes from emscripten's own ports, so nothing is looked up
# through pkg-config here. Two of the engine's optional subsystems are compiled
# out for this target (see RetroEngine.hpp):
#   * networking - asio has no socket backend under wasm
#   * video      - libtheora has no emscripten port
# =============================================================================

STATIC = 0
STRIP  = :

# No system libraries to discover; ports are requested with -sUSE_* below.
PKGCONFIG_DEPS =

# theoraplay is the libtheora wrapper, dropped along with video playback.
THEORAPLAY_SOURCES =

SUFFIX    = .js
PKGSUFFIX = .js

# Drop the build straight next to the page that loads it.
OUTDIR = web/dist
OBJDIR = obj/Emscripten

EMS_PORTS = -sUSE_SDL=2 -sUSE_OGG=1 -sUSE_VORBIS=1

CFLAGS += $(EMS_PORTS)

# The engine's own defaults for these live in RetroEngine.hpp; repeating BASE_PATH
# here keeps the layout visible from the build.
CFLAGS += -DBASE_PATH='"/rsdk/"'

# The data file is fetched by the page and can be tens of megabytes, and
# graphicData alone is a 64MB static array, so start with room and allow growth.
EMS_MEMORY = \
	-sALLOW_MEMORY_GROWTH=1 \
	-sINITIAL_MEMORY=201326592 \
	-sMAXIMUM_MEMORY=1073741824 \
	-sSTACK_SIZE=5242880

# ccall/cwrap reach the RSDK_* exports; FS/IDBFS are used by the page to install
# the data file and to keep save data in IndexedDB.
EMS_RUNTIME = \
	-sMODULARIZE=1 \
	-sEXPORT_NAME=createRetroEngine \
	-sEXPORT_ES6=0 \
	-sENVIRONMENT=web \
	-sFORCE_FILESYSTEM=1 \
	-lidbfs.js \
	-sEXPORTED_RUNTIME_METHODS=ccall,cwrap,FS,IDBFS,callMain,addRunDependency,removeRunDependency,UTF8ToString,HEAPU8 \
	-sEXPORTED_FUNCTIONS=_main,_RSDK_SetButtonState,_RSDK_ClearButtonStates,_RSDK_SetFocused,_RSDK_RequestSaveSync,_RSDK_GetInputHeld,_RSDK_GetGameType,_RSDK_GetScreenWidth,_RSDK_GetScreenHeight,_RSDK_IsRunning,_RSDK_GetFrameCount,_RSDK_ScreenIsBlank,_RSDK_GetStatusJSON,_RSDK_SetDebugMode,_RSDK_SetForceLog

# The engine reads past a few buffers in ways that are harmless natively but trip
# wasm's stricter checks, so leave the growth-time assertions off in release.
EMS_LINK = \
	$(EMS_PORTS) \
	$(EMS_MEMORY) \
	$(EMS_RUNTIME) \
	-sEXIT_RUNTIME=0 \
	-sASSERTIONS=0 \
	--profiling-funcs \
	-sDISABLE_EXCEPTION_CATCHING=0 \
	-sALLOW_UNIMPLEMENTED_SYSCALLS=1 \
	-sWASM_BIGINT=1

ifeq ($(DEBUG),1)
	EMS_LINK += -sASSERTIONS=2 -sSAFE_HEAP=0 -sDEMANGLE_SUPPORT=1 -gsource-map
endif

# SAFE=1 relinks the very same objects with the heap checker on, so it costs a
# link rather than a rebuild. An out-of-bounds access then aborts at the offending
# load or store with an address, instead of trapping somewhere further on with -O3
# having inlined away the evidence of who did it. Far too slow to play; it exists
# to find a bug once and then be thrown away.
#
#   emmake make PLATFORM=Emscripten SAFE=1 OUTDIR=web/dist-safe
ifeq ($(SAFE),1)
	EMS_LINK += -sSAFE_HEAP=1 -sASSERTIONS=2 -sSTACK_OVERFLOW_CHECK=2 -g2
endif

# SINGLE_FILE=1 base64s the wasm into the .js, so the whole engine is one script
# with nothing to fetch. Costs ~33% in transfer size, but it is the only way to
# ship to a host that serves a single self-contained file.
ifeq ($(SINGLE_FILE),1)
	EMS_LINK += -sSINGLE_FILE=1
endif

LDFLAGS += $(EMS_LINK)
