name: Deploy web build to GitHub Pages

# Builds the engine to WebAssembly and publishes web/ to GitHub Pages.
#
# No game assets are involved: the published page asks each player for the
# Data.rsdk from their own copy of the game and keeps it in their browser.

on:
  push:
    branches:
      - foreve
      - claude/sonic-forever-js-wasm-upod8x
    # Only rebuild when something that ends up on the page changes.
    paths:
      - 'RSDKv4/**'
      - 'dependencies/**'
      - 'web/**'
      - 'Makefile'
      - 'Makefile_cfgs/**'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; let a running one finish rather than cancelling
# it, so Pages is not left serving a half-published site.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Pinned rather than "latest" so a toolchain release cannot silently change
  # what gets published. Bump deliberately.
  EMSDK_VERSION: 6.0.6

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          # tinyxml2 and stb-image are needed to compile; theoraplay and asio are
          # not used by this target but are cheap and keep the tree consistent.
          submodules: recursive

      - name: Cache the Emscripten SDK
        id: cache-emsdk
        uses: actions/cache@v4
        with:
          path: ~/emsdk
          key: emsdk-${{ env.EMSDK_VERSION }}

      - name: Install the Emscripten SDK
        if: steps.cache-emsdk.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git ~/emsdk
          ~/emsdk/emsdk install "$EMSDK_VERSION"
          ~/emsdk/emsdk activate "$EMSDK_VERSION"

      # SDL2, libogg and libvorbis are built as emscripten ports on first use;
      # keeping that cache turns a ~5 minute step into seconds.
      - name: Cache the compiled ports
        uses: actions/cache@v4
        with:
          path: ~/emsdk/upstream/emscripten/cache
          key: emports-${{ env.EMSDK_VERSION }}-${{ hashFiles('Makefile_cfgs/Platforms/Emscripten.cfg') }}
          restore-keys: emports-${{ env.EMSDK_VERSION }}-

      - name: Build
        run: |
          source ~/emsdk/emsdk_env.sh
          emmake make PLATFORM=Emscripten -j"$(nproc)"

      # The opcode list differs between RSDKv4 revisions, and which one applies
      # is a property of the data file rather than of the engine, so data from
      # the original Sonic 1 release needs its own build. Reached with ?rev=0.
      - name: Build the rev 0 opcode variant
        run: |
          source ~/emsdk/emsdk_env.sh
          emmake make PLATFORM=Emscripten REV=0 \
            OBJDIR=obj/Emscripten-rev0 OUTDIR=web/dist-rev0 -j"$(nproc)"

      # Heap-checked and unoptimised, in its own object directory. Reached with
      # ?safe=1 when something needs diagnosing. Unoptimised matters: at -O3 the
      # frames worth reading are inlined away and the stack is just indices.
      - name: Build the heap-checked variant
        run: |
          source ~/emsdk/emsdk_env.sh
          emmake make PLATFORM=Emscripten SAFE=1 DEBUG=1 \
            OBJDIR=obj/Emscripten-safe OUTDIR=web/dist-safe -j"$(nproc)"

      - name: Assemble the site
        run: |
          mkdir -p _site
          cp -r web/index.html web/styles.css web/js web/icons \
                web/manifest.webmanifest web/sw.js web/dist web/dist-safe web/dist-rev0 _site/
          # Tell Pages to serve the files as-is rather than running them
          # through Jekyll, which would drop anything starting with an underscore.
          touch _site/.nojekyll

          # Pages serves everything with max-age=600 and no version in the URL,
          # so a browser can pair a fresh index.html with a stale boot.js. Keying
          # the assets to the commit makes that combination impossible.
          node web/tools/stamp-version.mjs _site "${GITHUB_SHA}"

          echo "--- published files ---"
          find _site -type f | sort

      # One-time repository setup, needed before the first successful run:
      #   Settings -> Pages -> Build and deployment -> Source -> "GitHub Actions"
      #
      # This step cannot do it. Creating a Pages site that has never existed
      # needs admin rights, and the automatic GITHUB_TOKEN does not have them
      # (`enablement: true` here fails with "Resource not accessible by
      # integration"). Once the source is set, every run from then on is
      # automatic.
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
